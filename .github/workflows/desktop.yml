name: Desktop CI & Release

# Desktop pipeline for the desktop/ Tauri port (Rust + Vite/React). On PRs and
# non-release pushes it does a compile check (`tauri build --no-bundle`) across
# Windows + macOS + Linux. Main pushes publish prerelease bundles;
# only deliberate desktop-v* tag pushes select a production desktop release.
#
# Release scheme is namespaced so it sits separately from the Android
# android-v* / android-dev.N releases on the Releases page:
#   desktop-v* tag  -> production desktop release
#   push to main    -> desktop-dev.<run_number> PRERELEASE
#   push to dev     -> compile-check only, NO release
# Production stays held until Patrick tests all five apps and then approves it.
#
# PATH-FILTERED: PRs and dev pushes only build when desktop/** or the shared
# native C core (ft8af/app/src/main/cpp/**) changes, or this workflow file.
# main pushes and desktop-v* tags always build. The always-run
# `desktop-gate` job is the required status check.

on:
  push:
    branches: [main, dev]
    tags:
      - 'desktop-v*'
  pull_request:
    branches: [main, dev]
  # Manual, on-demand bundled build from any branch (e.g. to hand someone an
  # installer to test without merging WIP into main) -- see the `version` job's
  # `workflow_dispatch` tag branch below for the one-off tag scheme this uses.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/desktop-v')))
      && 'desktop-release'
      || format('desktop-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test release event/ref policy (offline, no publishing)
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_policy.py' -v

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop:
              - 'ft8af/app/src/main/cpp/**'
              - 'desktop/**'
              - '.github/workflows/desktop.yml'

      - name: Decide whether to run
        id: decide
        env:
          CHANGED: ${{ steps.filter.outputs.desktop }}
        run: |
          set -euo pipefail
          # main pushes and desktop-v* tags always build the full
          # release; otherwise (dev push, PRs) build only when desktop-relevant
          # files changed.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual run: always build, on whatever branch it was dispatched
            # from -- there's no base ref to path-filter against.
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/desktop-v* ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Determine desktop release tag
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      version_name: ${{ steps.tag.outputs.version_name }}
      app_version: ${{ steps.tag.outputs.app_version }}
      should_release: ${{ steps.tag.outputs.should_release }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          # Mirrors the Android lane logic but in the desktop-v* / desktop-dev-N
          # namespace so desktop releases sort separately from the app's.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # On-demand bundled build from whatever branch this was dispatched
            # on (see the `on:` block's workflow_dispatch comment) -- a
            # throwaway, clearly-labeled prerelease tag, never desktop-v* and
            # never the main-push desktop-dev.N scheme, so it can't collide
            # with either.
            branch_slug="${GITHUB_REF_NAME//\//-}"
            new_tag="desktop-manual.${GITHUB_RUN_NUMBER}"
            latest=$(git tag --list 'desktop-v*' --sort=-v:refname | head -n1)
            base_ver="${latest:+${latest#desktop-v}}"
            base_ver="${base_ver:-0.1.0}"
            echo "release_tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "version_name=${base_ver}-manual.${GITHUB_RUN_NUMBER} (${branch_slug})" >> "$GITHUB_OUTPUT"
            IFS='.' read -ra parts <<< "$base_ver"
            last_idx=$((${#parts[@]} - 1))
            parts[$last_idx]=$((parts[$last_idx] + 1))
            # "+" not "-": RPM's version-string validator rejects a literal
            # hyphen (only alphanumeric/./_/+/%/{}/~/^ are allowed), and deb/
            # WiX both tolerate "+" fine, so this one separator choice has to
            # work for every bundler target at once.
            echo "app_version=$(IFS=.; echo "${parts[*]}")+${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version_name=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
            echo "app_version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main cuts internal prereleases, never desktop-v*.
            new_tag="desktop-dev.${GITHUB_RUN_NUMBER}"
            latest=$(git tag --list 'desktop-v*' --sort=-v:refname | head -n1)
            base_ver="${latest:+${latest#desktop-v}}"
            base_ver="${base_ver:-0.1.0}"
            echo "release_tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "version_name=${base_ver}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            # The bundled app version must sort below the next release, so
            # stamp <next patch>+<run>. "+" not "-": RPM's version-string
            # validator rejects a literal hyphen (only alphanumeric/./_/+/
            # %/{}/~/^ are allowed), and deb/WiX both tolerate "+" fine.
            IFS='.' read -ra parts <<< "$base_ver"
            last_idx=$((${#parts[@]} - 1))
            parts[$last_idx]=$((parts[$last_idx] + 1))
            echo "app_version=$(IFS=.; echo "${parts[*]}")+${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # dev push, PR, or other branch — compile-check only, no release.
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "version_name=" >> "$GITHUB_OUTPUT"
            echo "app_version=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: [detect, version]
    if: ${{ needs.detect.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # `target` empty = the runner's native host triple (unchanged
        # behavior for these three). The 4th entry cross-compiles on the
        # SAME windows-latest runner down to 32-bit x86 for Windows 10 x86 --
        # build.rs/build_support.rs already had the C-core (clang-cl target
        # flag) and vendored-DLL (hamlib/x86) support for this wired in
        # before any CI leg actually exercised it; this is what turns that
        # groundwork into a real, published artifact.
        include:
          - os: ubuntu-latest
            target: ''
            label: ubuntu-latest
          - os: macos-latest
            target: ''
            label: macos-latest
          - os: windows-latest
            target: ''
            label: windows-latest
          - os: windows-latest
            target: i686-pc-windows-msvc
            label: windows-latest (x86)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Only the i686 leg needs this -- the other three build for the
      # runner's own default host target, already installed by the stable
      # toolchain above.
      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # `key` disambiguates the two windows-latest legs (x64 vs x86), which
      # would otherwise share a cache key and corrupt each other's
      # target/ directory between runs.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      # Tauri v2 Linux system dependencies (webkit2gtk-4.1 + GTK + packaging),
      # plus the native libs our crates link against on Linux:
      #   - libudev-dev:    serialport's libudev-sys (CAT rig control)
      #   - libasound2-dev: alsa-sys (audio capture/playback)
      # Without these the Linux build fails resolving the `libudev` / `alsa`
      # pkg-config packages.
      #
      # ubuntu-latest is Ubuntu 24.04, which dropped libappindicator3-dev in
      # favour of the Ayatana fork — use libayatana-appindicator3-dev (Tauri's
      # current documented prerequisite).
      #
      # DEBIAN_FRONTEND=noninteractive + DPkg::Lock::Timeout guard against the two
      # ways this step hangs forever on hosted runners: a debconf prompt that -y
      # doesn't suppress, and apt blocking on the dpkg lock held by a background
      # apt-daily job (instead, wait up to 10 min then fail loudly).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=600 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            libasound2-dev \
            patchelf \
            file \
            build-essential \
            curl \
            wget

      # build.rs compiles the C core with clang-cl on the windows-msvc target
      # (MSVC's cl.exe rejects ft8_lib's C99 VLAs). LLVM/clang-cl is preinstalled
      # on the GitHub windows runners; this just confirms it's resolvable.
      - name: Verify clang-cl (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: clang-cl --version || echo "::warning::clang-cl not on PATH; build.rs falls back to C:\\Program Files\\LLVM\\bin"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test frontend logic
        working-directory: desktop
        run: npm test

      # --- Non-release: compile check only (no bundles), fastest path. ---
      - name: Compile check (no bundle)
        if: ${{ needs.version.outputs.should_release != 'true' }}
        working-directory: desktop
        run: npm run tauri build -- --no-bundle ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # The manifests stay at a placeholder version in git; a release build gets
      # the tag-derived version stamped into tauri.conf.json (bundle/installer
      # version) and Cargo.toml (CARGO_PKG_VERSION in the WSJT-X heartbeat).
      - name: Stamp release version
        if: ${{ needs.version.outputs.should_release == 'true' }}
        working-directory: desktop
        run: node ci/stamp-version.mjs "${{ needs.version.outputs.app_version }}"

      # --- Release: build native bundles and upload to the per-platform release.
      # tauri.conf.json has bundle.active=false (keeps local dev builds bundle-
      # free), so enable bundling for the release build via an inline --config
      # merge. Each OS produces its native targets (dmg/app, msi/nsis,
      # deb/appimage) from the base config's targets:"all". All matrix legs share
      # one tagName; tauri-action creates the release once and attaches to it. ---
      - name: Build & publish release bundles
        if: ${{ needs.version.outputs.should_release == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.version.outputs.release_tag }}
          releaseName: ${{ needs.version.outputs.release_tag }}
          releaseBody: 'FT8AF desktop build ${{ needs.version.outputs.version_name }}.'
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          args: --config '{"bundle":{"active":true}}' ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

  build-debian-arm64:
    name: Build (debian-bookworm-arm64)
    # A genuine native Debian 12 (Bookworm) arm64 .deb -- the existing `build`
    # job's ubuntu-latest leg produces an amd64 .deb built against Ubuntu
    # 24.04's library versions, which is a different distro/arch than this
    # project's actual ARM SBC targets (Armbian/Debian Bookworm, confirmed
    # directly on one: `libwebkit2gtk-4.1-dev`/`libayatana-appindicator3-dev`
    # are both in Bookworm's own main+security repos, no backports needed).
    # Runs INSIDE a `debian:bookworm` container (not just an Ubuntu runner)
    # so every linked library is Bookworm's own package version, on a native
    # `ubuntu-24.04-arm` hosted runner -- no QEMU/cross-compilation.
    #
    # Scoped to just the deb bundle (targets override below): the container
    # has no rpmbuild (irrelevant here -- rpm already comes from the Ubuntu
    # leg) and AppImage's own tooling adds real complexity for marginal value
    # on a target that's always installed via its native package manager.
    #
    # NON-GATING for now (left out of desktop-gate's needs, same as
    # `coverage` below) -- this is the first time this exact runner+
    # container+Tauri combination has been exercised in CI; promote it to a
    # required leg once it's proven reliable across a few real runs.
    needs: [detect, version]
    if: ${{ needs.detect.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      # Installed before checkout: a fresh container image has neither.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            libasound2-dev \
            patchelf \
            file \
            build-essential \
            pkg-config

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: debian-bookworm-arm64

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test frontend logic
        working-directory: desktop
        run: npm test

      - name: Compile check (no bundle)
        if: ${{ needs.version.outputs.should_release != 'true' }}
        working-directory: desktop
        run: npm run tauri build -- --no-bundle

      - name: Stamp release version
        if: ${{ needs.version.outputs.should_release == 'true' }}
        working-directory: desktop
        run: node ci/stamp-version.mjs "${{ needs.version.outputs.app_version }}"

      - name: Build & publish release bundles
        if: ${{ needs.version.outputs.should_release == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.version.outputs.release_tag }}
          releaseName: ${{ needs.version.outputs.release_tag }}
          releaseBody: 'FT8AF desktop build ${{ needs.version.outputs.version_name }}.'
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          args: --config '{"bundle":{"active":true,"targets":["deb"]}}'

  build-debian-armhf:
    name: Build (debian-bookworm-armhf)
    # A genuine Debian 12 (Bookworm) armhf .deb for 32-bit ARM boards (e.g.
    # a Raspberry Pi Zero 2 W running the 32-bit Raspberry Pi OS). Unlike
    # the arm64 leg above, this CROSS-compiles rather than running armhf
    # code directly: GitHub's arm64 hosted runners are Ampere Altra, which
    # drops AArch32 (32-bit ARM) hardware support entirely, so an armhf
    # container/binary can't execute here at all without QEMU emulation.
    # Debian's multiarch support makes cross-compiling clean instead:
    # armhf is added as a second dpkg architecture inside the SAME
    # debian:bookworm container the arm64 leg uses (armhf/arm64 is one of
    # the best-supported Debian multiarch pairs, no conflict installing
    # both side by side), and gcc-arm-linux-gnueabihf + the matching Rust
    # target cross-compile the whole app -- nothing in this job ever
    # executes an armhf instruction itself.
    #
    # NON-GATING (left out of desktop-gate's needs, same as the arm64 leg
    # and `coverage` below) -- first time this exact cross-compilation
    # combination has been exercised in CI; promote once proven reliable.
    needs: [detect, version]
    if: ${{ needs.detect.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    env:
      PKG_CONFIG_ALLOW_CROSS: '1'
      PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
      PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
    steps:
      # Installed before checkout: a fresh container image has neither.
      - name: Install cross-compilation toolchain and armhf dev packages
        run: |
          # qemu-user-static (native arm64 package -- the emulator itself,
          # not the thing being emulated) registers binfmt_misc handlers so
          # any armhf ELF executed in this container transparently runs
          # under QEMU. Required even though the actual app build is a pure
          # cross-compile: some :armhf -dev packages' own dependency chain
          # (gobject-introspection -> build-essential:armhf, pulled in by
          # libgtk-3-dev:armhf) has maintainer (postinst) scripts that need
          # to genuinely execute armhf code during installation/
          # configuration, not just provide headers/libraries to link
          # against -- that's a real execution need dpkg/apt can't route
          # around on its own, confirmed by the first attempt here failing
          # apt's dependency resolution outright ("not installable") with
          # this package missing.
          apt-get update
          apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget \
            gcc-arm-linux-gnueabihf \
            libwebkit2gtk-4.1-dev:armhf \
            libgtk-3-dev:armhf \
            librsvg2-dev:armhf \
            libayatana-appindicator3-dev:armhf \
            libudev-dev:armhf \
            libasound2-dev:armhf \
            patchelf \
            file \
            build-essential \
            pkg-config

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: debian-bookworm-armhf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Test frontend logic
        working-directory: desktop
        run: npm test

      - name: Compile check (no bundle)
        if: ${{ needs.version.outputs.should_release != 'true' }}
        working-directory: desktop
        run: npm run tauri build -- --no-bundle --target armv7-unknown-linux-gnueabihf

      - name: Stamp release version
        if: ${{ needs.version.outputs.should_release == 'true' }}
        working-directory: desktop
        run: node ci/stamp-version.mjs "${{ needs.version.outputs.app_version }}"

      - name: Build & publish release bundles
        if: ${{ needs.version.outputs.should_release == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.version.outputs.release_tag }}
          releaseName: ${{ needs.version.outputs.release_tag }}
          releaseBody: 'FT8AF desktop build ${{ needs.version.outputs.version_name }}.'
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          args: --target armv7-unknown-linux-gnueabihf --config '{"bundle":{"active":true,"targets":["deb"]}}'

  coverage:
    name: Rust coverage
    # Best-effort, NON-GATING desktop coverage: runs the src-tauri crate's unit
    # tests (src/*.rs #[cfg(test)] modules) under cargo-llvm-cov and uploads to
    # Codecov under the `desktop` flag. Path-gated via `detect` (skips on unrelated
    # PRs) and intentionally left OUT of `desktop-gate` — a coverage flake must
    # never block a merge or a release. Linux-only; reuses the same system deps the
    # build leg needs to link serialport(libudev) + alsa.
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=600 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            libasound2-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cargo llvm-cov runs `cargo test`, which compiles build.rs ->
      # tauri_build::build(). tauri.conf.json's frontendDist ("../dist") must
      # exist at compile time, and cargo — unlike `tauri build` — does NOT run the
      # configured beforeBuildCommand, so build the Vite frontend (outDir: dist)
      # here first. Without this the crate fails to compile on a missing dist.
      - name: Build frontend (produces desktop/dist for tauri-build)
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        working-directory: desktop/src-tauri
        run: cargo llvm-cov --lcov --output-path desktop.lcov

      - name: Upload desktop coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: desktop/src-tauri/desktop.lcov
          flags: desktop

  desktop-gate:
    name: desktop-gate
    # Always-run aggregator: the single required status check for desktop.
    # Reports success when every build leg passed OR the build was path-skipped,
    # so branch protection never gets stuck "pending" on an unrelated change.
    # Depends on `detect` and `version` too: a failure in either skips `build`,
    # and a skip alone would otherwise be read as "nothing to do" and pass the
    # gate — so their results are checked directly.
    needs: [detect, version, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop jobs succeeded or were skipped
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for r in "$DETECT_RESULT" "$VERSION_RESULT" "$BUILD_RESULT"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A desktop job did not pass (detect=$DETECT_RESULT version=$VERSION_RESULT build=$BUILD_RESULT)"
              exit 1
            fi
          done
          echo "Desktop gate OK (detect=$DETECT_RESULT version=$VERSION_RESULT build=$BUILD_RESULT)."
